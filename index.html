<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLITCH.ENG | Signal Distortion</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        slate: { 850: '#151f32', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Base & Scrollbar */
        body { background-color: #020617; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Utility */
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-right: 1px solid rgba(51, 65, 85, 0.5); }
        .cyber-button { position: relative; overflow: hidden; transition: all 0.2s; }
        .cyber-button::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); transition: 0.5s; }
        .cyber-button:hover::after { left: 100%; }
        
        /* Loader */
        #loader { position: fixed; inset: 0; background: #020617; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .glitch-text { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 2rem; color: #fff; position: relative; letter-spacing: 0.2em; }
        .glitch-text::before, .glitch-text::after { content: 'GLITCH.ENG'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; }
        .glitch-text::before { color: #f0f; clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translate(-2px, -2px); animation: twitch 2s infinite linear alternate-reverse; }
        .glitch-text::after { color: #0ff; clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); transform: translate(2px, 2px); animation: twitch 2.5s infinite linear alternate-reverse; }
        @keyframes twitch { 0% { transform: translate(0); } 10% { transform: translate(-2px, -2px); } 20% { transform: translate(2px, 2px); } 30% { transform: translate(-2px, 2px); } 40% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="glitch-text">GLITCH.ENG</div>
        <div class="mt-4 text-slate-500 font-mono text-xs">INITIALIZING...</div>
    </div>
    <div id="root"></div>

    <script src="js/core/utils.js"></script>
    <script src="js/core/structuralSort.js"></script>
    <script src="js/effects/channelQuantization.js"></script>
    <script src="js/effects/channelRebinding.js"></script>
    <script src="js/effects/paletteCollapse.js"></script>
    <script src="js/effects/scanlineLogic.js"></script>
    <script src="js/effects/desyncEcho.js"></script>
    <script src="js/effects/rgbDrift.js"></script>
    <script src="js/effects/tearing.js"></script>
    <script src="js/effects/histogram.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ui/starter.js"></script>
    <script src="js/algorithms/dataMosher.js"></script>
    <script src="js/algorithms/spectralDrift.js"></script>
    <script src="js/algorithms/paletteCollapse.js"></script>
    <script src="js/algorithms/scanlineFailure.js"></script>
    <script src="js/algorithms/desyncEcho.js"></script>
    <script src="js/algorithms/voidRot.js"></script>
    <script type="text/babel" src="js/app.js"></script>

</body>
</html>
